name: Netstack correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libdpdk-dev python3-scapy iproute2 ethtool
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Single and multiple interface smoke tests
        run: |
          sudo unshare --net python3 tests/smoke.py "$PWD/build/netstack-dp"
          sudo unshare --net python3 tests/smoke.py "$PWD/build/udp-echo" --udp
          sudo unshare --net python3 tests/smoke_multi.py "$PWD/build/udp-echo"
          sudo unshare --net python3 tests/smoke_arp.py "$PWD/build/test-udp-initiator"
      - name: IPv4 forwarding namespace smoke
        run: |
          sudo unshare --net python3 tests/smoke_forward.py "$PWD/build/netstack-dp" \
            --artifacts "$PWD/build/forwarding-smoke"
      - name: TCP namespace smoke with packet loss
        run: |
          sudo unshare --net python3 tests/smoke_tcp.py "$PWD/build/tcp-echo" \
            "$PWD/build/test-tcp-initiator" --artifacts "$PWD/build/tcp-smoke"
      - name: ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize -j2
          ctest --test-dir build-sanitize --output-on-failure
          sudo env ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            unshare --net python3 tests/smoke.py "$PWD/build-sanitize/netstack-dp"
          sudo env ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            unshare --net python3 tests/smoke.py "$PWD/build-sanitize/udp-echo" --udp
          sudo env ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            unshare --net python3 tests/smoke_arp.py "$PWD/build-sanitize/test-udp-initiator"
          sudo env ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            unshare --net python3 tests/smoke_multi.py "$PWD/build-sanitize/udp-echo"
          sudo env ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            unshare --net python3 tests/smoke_tcp.py "$PWD/build-sanitize/tcp-echo" \
            "$PWD/build-sanitize/test-tcp-initiator" --artifacts "$PWD/build-sanitize/tcp-smoke"
          sudo env ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            unshare --net python3 tests/smoke_forward.py "$PWD/build-sanitize/netstack-dp" \
            --artifacts "$PWD/build-sanitize/forwarding-smoke"
      - name: Upload forwarding smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forwarding-smoke
          path: |
            build/forwarding-smoke
            build-sanitize/forwarding-smoke
          if-no-files-found: ignore
      - name: Upload TCP smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-smoke
          path: |
            build/tcp-smoke
            build-sanitize/tcp-smoke
          if-no-files-found: ignore
